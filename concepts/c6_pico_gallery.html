<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>案⑥ ギャラリー型｜WA CLINIC（雰囲気案）</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 案⑥：美術館の壁のような黒。大きな細い文字と、一本の光の線だけ。説明は最小限 */
:root{--bg:#0C0C0E;--ink:#F4F3EF;--ink2:#B6B4AE;--muted:#7A7872;--line:#2A2A2E;--glow:#E9E1FF;
--serif:"Noto Serif JP","Hiragino Mincho ProN",serif;--latin:"Cormorant Garamond",Georgia,serif;--sans:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.9;-webkit-font-smoothing:antialiased}
.page{max-width:430px;margin:0 auto;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}
header img{width:104px;filter:invert(1) brightness(1.7)}
header a{font-size:11.5px;letter-spacing:.12em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px}
.hero{position:relative;padding:40px 18px 30px;min-height:520px}
.label{font-family:var(--latin);font-style:italic;font-size:15px;color:var(--ink2);margin:0 0 18px;letter-spacing:.04em}
.big{font-family:var(--serif);font-weight:300;font-size:58px;line-height:1.15;margin:0;letter-spacing:.02em}
.big small{display:block;font-size:20px;font-weight:300;color:var(--ink2);letter-spacing:.2em;margin-top:10px}
.line{position:relative;height:1px;margin:36px 0 26px;background:var(--line);overflow:visible}
.line::after{content:"";position:absolute;top:-1px;left:0;width:38%;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(233,225,255,0),var(--glow),rgba(233,225,255,0));box-shadow:0 0 18px 4px rgba(233,225,255,.35);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,100%{left:0}50%{left:62%}}
@media (prefers-reduced-motion:reduce){.line::after{animation:none;left:31%}}
.copy{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.9;margin:0 0 8px}
.small{font-size:12.5px;color:var(--ink2);margin:0}
.photo{position:relative;margin:0 0 0}
.photo img{width:100%;height:420px;object-fit:cover;object-position:50% 15%;filter:grayscale(1) contrast(1.05) brightness(.9);display:block}
.photo span{position:absolute;right:12px;bottom:10px;font-size:9.5px;color:rgba(244,243,239,.7)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:22px 8px;text-align:center;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--serif);font-weight:300;font-size:22px;line-height:1.2}
.facts small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin-top:6px}
.end{padding:34px 18px 46px;text-align:center}
.end p{font-family:var(--serif);font-weight:300;font-size:16px;margin:0 0 20px}
.btn{display:inline-block;color:var(--ink);text-decoration:none;font-size:14px;letter-spacing:.1em;border:1px solid var(--ink);padding:14px 30px}
.end small{display:block;font-size:11px;color:var(--muted);margin-top:18px;line-height:1.7}
</style></head><body><div class="page">
<header><img src="../assets/lp/logo-yoko-black.png" alt="WA CLINIC"><a href="#">RESERVE</a></header>
<section class="hero">
<p class="label">Picosecond Toning</p>
<h1 class="big">1兆分の<br>1秒。<small>ピコ秒の光</small></h1>
<div class="line" aria-hidden="true"></div>
<p class="copy">ピコ秒レーザーで、<br>肌の色ムラにアプローチ。</p>
<p class="small">低出力のレーザーを、お顔全体に。シミ・くすみ・色ムラの改善を目指します。</p>
</section>
<div class="photo"><img src="../assets/ai/pico-a-hero.jpg" alt="肌のイメージ（モデル）"><span>※画像はイメージです</span></div>
<div class="facts">
<div><b>全顔</b><small>FULL FACE</small></div>
<div><b>VISIA</b><small>SKIN ANALYSIS</small></div>
<div><b>1分</b><small>GINZA STA.</small></div>
</div>
<section class="end">
<p>まずは、肌を知るところから。</p>
<a class="btn" href="#">初回体験を見る</a>
<small>医師の診察・VISIA肌診断つき。効果や経過には個人差があり、1回での改善を保証するものではありません。</small>
</section>
</div></body></html>
